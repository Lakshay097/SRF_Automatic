name: Sync SRF SHEET

on:
  workflow_dispatch:

jobs:
  sync-srf-sheet:
    name: Sync - SRF SHEET
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Google credentials to file
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: printf '%s' "$GOOGLE_CREDS" > credentials.json

      - name: Debug credentials file
        run: |
          echo "File size:"
          wc -c credentials.json
          echo "First 50 chars:"
          head -c 50 credentials.json

      - name: Run srf_automatic.py
        env:
          JOTFORM_API_KEY:         ${{ secrets.JOTFORM_API_KEY }}
          JOTFORM_FORM_ID:         ${{ secrets.JOTFORM_FORM_ID }}
          GOOGLE_SHEET_NAME:       ${{ secrets.GOOGLE_SHEET_NAME }}
          GOOGLE_WORKSHEET_NAME:   ${{ secrets.GOOGLE_WORKSHEET_NAME }}
          START_DATE:              ${{ secrets.START_DATE }}
          GOOGLE_CREDENTIALS_JSON: credentials.json
        run: python srf_automatic.py

      - name: Clean up credentials
        if: always()
        run: rm -f credentials.json